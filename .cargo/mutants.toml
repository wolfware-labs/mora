# cargo-mutants (spec §20.5): CI mutates the lines a pull request changes,
# and every mutant must make a test fail or stop the build. A mutant that
# survives marks code no test checks.

exclude_globs = [
    # Generated by `cargo xtask codegen`; tested through the grammar.
    "crates/mora-syntax/src/generated/**",
    # Glue around other programs, left out of coverage for the same reason:
    # the CI jobs that run `cargo xtask` exercise it end to end.
    "xtask/src/main.rs",
    "xtask/src/runtime.rs",
]

# Mutants that survive a full run: first the ones that cannot change
# behaviour, then the ones only checks outside `cargo test` catch. Each
# entry is one whole mutant name, file:line:col included: other mutations
# at the same spot still run, and an edit that moves the code brings the
# mutant back for review instead of hiding a new one with the same name.
exclude_re = [
    # The overflow fallback: reached only after 584 years of uptime.
    '^crates/mora-rt/src/pal\.rs:89:57: replace - with / in mora_pal_now$',
    # Not called yet: codegen emits it only when no token separates two
    # children of one type, and the grammar has no such pair today.
    '^crates/mora-syntax/src/ast\.rs:56:9: replace support::nth_child -> Option<N> with None$',
    # Lexer arithmetic that lands on the same result: index 0 of an
    # identifier is always an identifier character, number errors always
    # start at offset 0, quotes stepped one at a time reach the same place,
    # and the raw-string indent scan only gains or loses blank lines.
    '^crates/mora-syntax/src/lexer/mod\.rs:467:39: replace > with >= in Lexer<.a>::code_token$',
    '^crates/mora-syntax/src/lexer/mod\.rs:499:51: replace \+ with - in Lexer<.a>::code_token$',
    '^crates/mora-syntax/src/lexer/mod\.rs:700:25: replace > with < in Lexer<.a>::raw_string$',
    '^crates/mora-syntax/src/lexer/mod\.rs:943:60: replace \+ with \* in Lexer<.a>::check_raw$',
    '^crates/mora-syntax/src/lexer/mod\.rs:944:26: replace < with <= in Lexer<.a>::check_raw$',
    '^crates/mora-syntax/src/lexer/mod\.rs:944:57: replace \+ with \* in Lexer<.a>::check_raw$',
    '^crates/mora-syntax/src/lexer/number\.rs:235:37: replace \+ with \* in separators$',
    # Popping the last event and leaving a tombstone build the same tree.
    '^crates/mora-syntax/src/parser/mod\.rs:175:21: replace \+ with - in Marker::abandon$',
    '^crates/mora-syntax/src/parser/mod\.rs:175:21: replace \+ with \* in Marker::abandon$',
    # The scan starting one token early sees the `?` itself, which it skips;
    # scanning past the end reads the end-of-file kind.
    '^crates/mora-syntax/src/parser/exprs\.rs:262:20: replace \+ with \* in conditional_follows$',
    '^crates/mora-syntax/src/parser/exprs\.rs:263:13: replace < with <= in conditional_follows$',
    # At the top level an item without attributes only gets this far when
    # it starts a declaration, which the attributed-statement arms never take.
    '^crates/mora-syntax/src/parser/items\.rs:180:30: replace > with >= in declaration$',
    # The placeholder compiler has no backends either way.
    '^crates/mora-testkit/src/compiler\.rs:38:9: replace <impl Compiler for Unbuilt>::backends -> &\[Backend\] with Vec::leak\(Vec::new\(\)\)$',
    # Width of a separator line; any width reads the same.
    '^crates/mora-testkit/src/diff\.rs:32:87: replace \+ with \* in diff$',
    # Codegen paths that produce the same text: the widened ranges only add
    # nodes, which carry no token kind; equal fields merge to themselves; and
    # `show` already brackets a nested sequence or alternative.
    '^xtask/src/codegen\.rs:584:32: replace \+ with \* in place$',
    '^xtask/src/codegen\.rs:590:40: replace \+ with \* in place$',
    '^xtask/src/codegen\.rs:609:31: replace match guard \*existing == field with false in dedupe$',
    '^xtask/src/codegen\.rs:663:9: delete match arm Rule::Seq\(_\) \| Rule::Alt\(_\) in show$',
    '^xtask/src/codegen\.rs:674:21: delete match arm Rule::Alt\(_\) in show$',
    # `ALLOW` is empty, so the comparison never runs.
    '^xtask/src/target_names\.rs:325:62: replace == with != in check$',

    # Not equivalent, but checked outside `cargo test`, which is all that
    # cargo-mutants runs. CI's `runtime` job covers both:
    # - `main` is built only into the runtime library; `cargo xtask runtime
    #   --test` links a C program whose `__mora_main` returns 42 and checks
    #   the process exits with 42.
    '^crates/mora-rt/src/start\.rs:16:5: replace main -> c_int with Default::default\(\)$',
    # - Windows hosts only; the Windows legs run `cargo xtask sysroot`,
    #   which installs llvm-mingw and checks the linker it copied.
    '^xtask/src/sysroot\.rs:265:18: replace == with != in install_llvm_mingw$',
    '^xtask/src/sysroot\.rs:265:34: replace \|\| with && in install_llvm_mingw$',
]
