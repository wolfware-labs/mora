name: ci

on:
  pull_request:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Decides whether the change needs a build. A change that touches only
  # Markdown skips it, except for the documents that hold executable
  # examples (spec §20.5). Jobs skipped through `if:` report success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (manual run, new branch): build.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A file, not a pipe: with pipefail, `grep -q` closing a pipe early
          # would fail `git diff` and skip a real change.
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
          executable_docs='^(docs/design/mora\.md|docs/errors/|docs/guide/)'
          if grep -qvE '\.md$' "$RUNNER_TEMP/changed-files" \
            || grep -qE "$executable_docs" "$RUNNER_TEMP/changed-files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Every check, on x86_64 Linux. Steps after the first run with
  # `!cancelled()`, so one run reports every failing check.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked
      - name: doc
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps --locked
      - name: cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny check
      - name: xtask layers
        if: ${{ !cancelled() }}
        run: cargo xtask layers
      - name: xtask error-codes
        if: ${{ !cancelled() }}
        run: cargo xtask error-codes
      - name: xtask spec-examples
        if: ${{ !cancelled() }}
        run: cargo xtask spec-examples
      - name: xtask codegen
        if: ${{ !cancelled() }}
        run: cargo xtask codegen --check

  # Lints and tests on the other Tier 1 and Tier 2 hosts (spec §19.1).
  platforms:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked

  # Portability guard (spec §19.4 rule 5): the runtime core builds for a
  # 32-bit bare-metal target.
  thumbv7em:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build mora-rt-core
        run: cargo build -p mora-rt-core --target thumbv7em-none-eabihf --locked
      - name: build mora-rt-core (debug runtime)
        if: ${{ !cancelled() }}
        run: cargo build -p mora-rt-core --target thumbv7em-none-eabihf --features debug --locked

  # Both runtime libraries (spec §13.2) for every hosted target of §19.1.
  # On the runners that can execute the target, a C program linked against
  # each one must exit with the code its `__mora_main` returns.
  runtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, test: "--test", cc: musl-gcc }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: "--test", cc: musl-gcc }
          - { os: macos-latest, target: aarch64-apple-darwin, test: "--test", cc: cc }
          # The runner is arm64; the program runs under Rosetta 2.
          - { os: macos-latest, target: x86_64-apple-darwin, test: "--test", cc: cc, cflags: "-arch x86_64", rosetta: true }
          - { os: windows-2025, target: x86_64-pc-windows-gnullvm, test: "--test", cc: x86_64-w64-mingw32-clang, mingw: x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-gnullvm, test: "--test", cc: aarch64-w64-mingw32-clang, mingw: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install musl-gcc
        if: ${{ matrix.cc == 'musl-gcc' }}
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install Rosetta 2
        if: ${{ matrix.rosetta }}
        run: sudo softwareupdate --install-rosetta --agree-to-license
      # The C compiler for the test program. `cargo xtask sysroot` installs
      # lld and the MinGW-w64 pieces from the same release, but no compiler.
      - name: Install llvm-mingw
        if: ${{ matrix.mingw }}
        shell: pwsh
        env:
          ARCH: ${{ matrix.mingw }}
          VERSION: "20261006"
          SHA256_X86_64: 317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a
          SHA256_AARCH64: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $name = "llvm-mingw-$env:VERSION-ucrt-$env:ARCH"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:VERSION/$name.zip" -OutFile $zip
          $expected = if ($env:ARCH -eq 'x86_64') { $env:SHA256_X86_64 } else { $env:SHA256_AARCH64 }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "llvm-mingw checksum mismatch: $actual" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$name\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: xtask runtime
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
          TARGET: ${{ matrix.target }}
          TEST: ${{ matrix.test }}
        run: cargo xtask runtime $TEST "$TARGET"
      # Checks the pinned linker and sysroot downloads for this host.
      - name: xtask sysroot
        if: ${{ !cancelled() }}
        run: cargo xtask sysroot

  # Test coverage (spec §20.5). This job runs the pull request's code, so it
  # gets no OIDC permission; it hands the report to `coverage-upload`.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Instrumented builds; kept apart so they do not evict the plain ones.
          key: coverage
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov
          path: lcov.info
          retention-days: 1

  # Uploads the report to Codecov through GitHub OIDC, so no token is stored.
  # It runs no code from the repository, only the pinned upload action, so
  # the OIDC permission never meets pull request code. Pull requests from
  # forks cannot mint a token, so their upload is best effort.
  coverage-upload:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov maps the report's paths onto the repository's files. Checking
      # out runs nothing from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov
      - name: upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          # A Codecov outage must not fail a pull request; the tests are the gate.
          fail_ci_if_error: false

  # Mutation testing on the lines a pull request changes (spec §20.5): each
  # mutant must make a test fail or stop the build. A mutant that survives is
  # code no test checks, and fails the job. Pushes to main are not mutated.
  mutants:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: mutants (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants
      - name: Diff against the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git diff "origin/$BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
      # --in-place builds in the checkout, so the cached target directory is
      # reused instead of copying the tree for every shard.
      - name: Mutate the changed lines
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --in-place --no-shuffle
          --shard ${{ matrix.shard }}/4 --output "$RUNNER_TEMP"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          retention-days: 7

  # One stable check name for rulesets: passes when every job above passed
  # or was skipped by the change filter. `coverage-upload` is left out: its
  # failure only means Codecov missed a report.
  ci-ok:
    needs: [changes, linux, platforms, thumbv7em, runtime, coverage, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
