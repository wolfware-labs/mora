# Codecov reports both the coverage of the whole workspace and the coverage
# of the lines a pull request changes, and comments on every pull request.

coverage:
  status:
    # Total coverage, against the base commit. A little slack, so a refactor
    # that moves covered code around does not fail on rounding.
    project:
      default:
        target: auto
        threshold: 1%
    # Coverage of the lines the pull request changed.
    patch:
      default:
        target: auto
        threshold: 0%

# Generated by `cargo xtask codegen` from `mora.ungram`; its accessors are
# tested through the grammar, not one by one.
ignore:
  - "crates/mora-syntax/src/generated/**"

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  # Comment even when coverage is unchanged, so a missing comment means the
  # upload failed.
  require_changes: false
