[package]
name = "mora-testkit"
description = "UI, run, spec-example and leak test harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mora-diag.workspace = true
mora-span.workspace = true

# Both read the `tests/ui` and `tests/run` suites at the repository root, with
# their own reports instead of the standard harness's.
[[test]]
name = "ui"
harness = false

[[test]]
name = "run"
harness = false
