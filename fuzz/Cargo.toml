# The fuzz targets (spec §20.1), run by `cargo fuzz` on a nightly toolchain.
# This crate sits outside the workspace, because libFuzzer needs nightly
# compiler flags; the nightly CI job runs it.

[package]
name = "mora-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
mora-syntax = { path = "../crates/mora-syntax" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
