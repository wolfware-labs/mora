# aarch64 Linux, statically linked against musl (§19.1).
name = "aarch64-linux"
triple = "aarch64-unknown-linux-musl"
os = "linux"
arch = "aarch64"
pointer-width = 64
endian = "little"
object-format = "elf"
call-conv = "aapcs64"
backend = "cranelift"
runtime = "hosted"
capabilities = ["heap", "threads", "fs", "net", "stdio", "clock", "random", "process", "env"]

[align]
i16 = 2
i32 = 4
i64 = 8
f32 = 4
f64 = 8
pointer = 8

[linker]
flavor = "ld.lld"
args = ["-static"]
